apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

def quoteBuildConfig = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.yunx.app'
    compileSdk 36
    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'XUNLEI_CLIENT_ID', quoteBuildConfig(project.findProperty('xunleiClientId')?.toString() ?: '')
        buildConfigField 'String', 'XUNLEI_CLIENT_SECRET', quoteBuildConfig(project.findProperty('xunleiClientSecret')?.toString() ?: '')
        buildConfigField 'String', 'XUNLEI_APP_CLIENT_ID', quoteBuildConfig(project.findProperty('xunleiAppClientId')?.toString() ?: '')
        buildConfigField 'String', 'XUNLEI_APP_CLIENT_SECRET', quoteBuildConfig(project.findProperty('xunleiAppClientSecret')?.toString() ?: '')
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api 'androidx.room:room-runtime:2.8.4'
    api 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    api platform('androidx.compose:compose-bom:2026.06.01')
    api 'androidx.compose.material3:material3:1.5.0-alpha18'
    implementation 'androidx.compose.material:material-icons-extended'
    api 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.webkit:webkit:1.17.1'
}
