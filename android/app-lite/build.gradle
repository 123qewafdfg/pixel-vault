apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def configuredApiBaseUrl = project.findProperty('apiBaseUrl')?.toString()
def resolvedApiBaseUrl = configuredApiBaseUrl ?: 'https://example.invalid'
def generatedLiteAssets = layout.buildDirectory.dir('generated/liteAssets')

android {
    namespace = 'com.trustmark.share'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.trustmark.share.lite'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName '3.1-lite'
        buildConfigField 'String', 'API_BASE_URL', '"' + resolvedApiBaseUrl + '"'
        manifestPlaceholders = [allowCleartext: configuredApiBaseUrl != null ? 'true' : 'false']
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17', '-O3' } }
    }

    ndkVersion '30.0.16248370'
    externalNativeBuild {
        cmake {
            path file('../app/src/main/cpp/CMakeLists.txt')
            version '4.1.2'
        }
    }
    androidResources { noCompress += ['onnx'] }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../app/src/main/java']
            java.exclude 'com/trustmark/share/MainActivity.kt'
            java.exclude 'com/trustmark/share/BiliApi.kt'
            java.exclude 'com/trustmark/share/BiliLoginUi.kt'
            java.exclude 'com/trustmark/share/BiliPayload.kt'
            java.exclude 'com/trustmark/share/BiliSession.kt'
            java.exclude 'com/trustmark/share/BiliWorkflow.kt'
            res.srcDirs = ['../app/src/main/res']
            assets.srcDirs = [generatedLiteAssets]
            jniLibs.srcDirs = ['../app/src/main/jniLibs']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../app/proguard-rules.pro'
        }
    }
}

tasks.register('prepareLiteAssets', Sync) {
    from('../app/src/main/nativeAssets/models/decoder_Q.onnx')
    into(generatedLiteAssets.map { it.dir('models') })
}

tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets' || task.name.toLowerCase().contains('lint')) {
        task.dependsOn tasks.named('prepareLiteAssets')
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation project(':cloud-drive')
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'
    implementation 'io.coil-kt.coil3:coil-gif:3.2.0'
    implementation 'io.coil-kt.coil3:coil-video:3.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
